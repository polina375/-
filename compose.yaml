
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: courses_for_bu
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/backup:ro
      - ./docker/restore.sh:/docker-entrypoint-initdb.d/10-restore.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d courses_for_bu
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  ingest:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/courses_for_bu
    command: >
      sh -c "[ -f data/embeddings.npy ] || python -m rag.ingest"
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/courses_for_bu
    command: python -m bot.main
    volumes:
      - ./data:/app/data
      - ./bot.sqlite3:/app/bot.sqlite3
    depends_on:
      ingest:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
